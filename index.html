    <style>

        .cl-amt { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }

        .cl-seg button.on.add { background: rgba(52,211,153,.18); color: #34d399; box-shadow: inset 0 0 0 1px rgba(52,211,153,.35); }
        .cl-seg button.on.sub { background: rgba(244,63,94,.18); color: #fb7185; box-shadow: inset 0 0 0 1px rgba(244,63,94,.35); }
        .cl-lbl { font-size: 12px; font-weight: 700; color: #8b96a9; margin-bottom: -6px; }
        .cl-amt-input { width: 100%; padding: 14px 16px !important; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .cl-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .cl-chips button { flex: 1; min-width: 44px; padding: 8px 0; font-size: 13px; background: rgba(59,130,246,.14); color: #7aa7ff; box-shadow: inset 0 0 0 1px rgba(59,130,246,.25); }
        .cl-chips button:hover { background: rgba(59,130,246,.28); }

        .cl-preview b { font-size: 17px; font-weight: 800; }
        .cl-preview em { font-style: normal; font-weight: 800; margin-left: 8px; padding: 2px 9px; border-radius: 999px; font-size: 12px; }
        .cl-preview em.add { background: rgba(52,211,153,.16); color: #34d399; }
        .cl-preview em.sub { background: rgba(244,63,94,.16); color: #fb7185; }

        /* ===== Redesign: top bar, neutral palette, smooth pages ===== */
        :root { --bg:#f6f6f4; --card:#ffffff; --row:#f3f3f1; --row2:#eaeae7; --line:#e4e4e0; --txt:#1c1c1a; --mut:#75756f; --acc:#1c1c1a; --acc-txt:#ffffff; --bar:rgba(246,246,244,.82); --ease:cubic-bezier(.22,.8,.3,1); }
        .dark { --bg:#141414; --card:#1b1b1b; --row:#202020; --row2:#282828; --line:#2a2a2a; --txt:#ececea; --mut:#8e8e88; --acc:#ececea; --acc-txt:#141414; --bar:rgba(20,20,20,.82); }
        html { scroll-behavior: smooth; }
        body, .dark body, body.dark { background: var(--bg) !important; color: var(--txt) !important; }
        /* top bar */
        .cl-bar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 22px; min-height: 68px; padding: 0 32px; background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
        .cl-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 800; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; color: var(--txt); }
        .cl-brand svg { border-radius: 9px; flex: none; box-shadow: 0 4px 12px -4px rgba(37,99,235,.6); }
        .cl-tabs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
        .cl-tabs::-webkit-scrollbar { display: none; }
        .cl-end { display: flex; align-items: center; gap: 4px; margin-left: auto; padding-left: 8px; }
        .cl-divider { width: 1px; height: 24px; background: var(--line); margin: 0 6px 0 2px; }
        .cl-action { color: var(--mut); }
        .cl-nav { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 13px; border-radius: 10px; color: var(--mut); font-size: 13.5px; font-weight: 600; background: transparent !important; white-space: nowrap; box-shadow: none !important; }
        .cl-nav i { font-size: 14px; }
        .cl-nav:hover { color: var(--txt); background: var(--row) !important; }
        .cl-nav.on { color: var(--txt); background: var(--row2) !important; }
        .cl-nav.on::after { content: ''; position: absolute; left: 13px; right: 13px; bottom: -13px; height: 2px; border-radius: 2px; background: var(--acc); animation: clLine .35s var(--ease); }
        .cl-nav.icon { width: 38px; padding: 0; justify-content: center; }
        .cl-nav.danger:hover { color: #b4574f; }
        .cl-nav[data-tip]:hover::before { content: attr(data-tip); position: absolute; top: 46px; right: 0; white-space: nowrap; background: var(--txt); color: var(--bg); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; pointer-events: none; z-index: 60; }
        .cl-nav.icon.on::after { left: 9px; right: 9px; }
        .cl-main { margin: 0 auto; padding: 36px 32px 64px; max-width: 1400px; }
        .cl-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
        .cl-title { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
        .cl-sub { color: var(--mut); font-size: 14px; margin-top: 6px; }
        .cl-switch { min-width: 220px; padding: 10px 14px !important; font-weight: 600; }
        /* surfaces (both themes) */
        .bg-white, .dark .bg-white, .dark .bg-slate-800, .dark .dark\:bg-slate-800 { background: var(--card) !important; }
        .bg-slate-50, .bg-slate-100 { background: var(--row) !important; }
        .dark .bg-slate-900, .dark .dark\:bg-slate-900 { background: var(--row) !important; }
        .dark .dark\:bg-slate-700 { background: var(--row2) !important; }
        .border-slate-200, .border-slate-100, .dark .border-slate-700, .dark .dark\:border-slate-700, .border-slate-300 { border-color: var(--line) !important; }
        .rounded-xl, .dark .rounded-xl { border-radius: 16px !important; }
        .shadow-sm, .dark .shadow-sm { box-shadow: none !important; }
        .text-slate-500, .text-slate-400, .dark .text-slate-500, .dark .dark\:text-slate-400 { color: var(--mut) !important; }
        .text-slate-800, .text-slate-900, .text-slate-700 { color: var(--txt) !important; }
        .dark .text-white { color: var(--txt) !important; }
        input, select, textarea { background: var(--card) !important; border: 1px solid var(--line) !important; color: var(--txt) !important; border-radius: 10px !important; transition: border-color .2s, box-shadow .2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--mut) !important; box-shadow: 0 0 0 3px rgba(128,128,120,.18) !important; }
        /* neutral accents: remove blue/purple/gradients */
        button[class*="bg-brand-"], button[class*="bg-purple-6"], button[class*="bg-slate-900"]:not(.cl-nav) { background: var(--acc) !important; color: var(--acc-txt) !important; border: 0 !important; box-shadow: none !important; }
        button[class*="bg-brand-"]:hover, button[class*="bg-slate-900"]:not(.cl-nav):hover { opacity: .88; filter: none !important; }
        button[class*="bg-rose-6"], button[class*="bg-red-6"], button[class*="bg-emerald-6"] { background: var(--acc) !important; color: var(--acc-txt) !important; box-shadow: none !important; }
        [class*="text-brand-"], [class*="text-purple-"] { color: var(--txt) !important; }
        [class*="bg-brand-"]:not(button), [class*="bg-purple-"]:not(button) { background: var(--row2) !important; }
        [class*="ring-brand-"] { --tw-ring-color: var(--mut) !important; }
        [class*="border-brand-"] { border-color: var(--mut) !important; }
        /* status colours: kept only as soft, muted signals */
        [class*="bg-emerald-1"], [class*="bg-emerald-5"]:not(.w-3), [class*="bg-emerald-9"] { background: rgba(110,140,120,.16) !important; }
        [class*="bg-rose-1"], [class*="bg-rose-5"]:not(.w-3), [class*="bg-rose-9"] { background: rgba(160,110,105,.16) !important; }
        [class*="bg-amber-1"], [class*="bg-amber-5"]:not(.w-3), [class*="bg-amber-9"] { background: rgba(160,140,100,.16) !important; }
        [class*="text-emerald-"] { color: #6f8f7c !important; }
        [class*="text-rose-"], [class*="text-red-"] { color: #a86f69 !important; }
        [class*="text-amber-"] { color: #a08f66 !important; }
        [class*="border-rose-"], [class*="border-amber-"], [class*="border-emerald-"] { border-color: var(--line) !important; }
        .w-3.h-3.rounded-full { box-shadow: none !important; }
        td button[title], td button[title^="View"], td button[title^="Edit"], td button[title^="Archive"], td button[title^="Unarchive"] { background: var(--row2) !important; color: var(--txt) !important; }
        button[class*="w-8"][class*="h-8"]:hover[title^="Decrease"], button[class*="w-8"][class*="h-8"]:hover[title^="Increase"] { background: var(--row2) !important; color: var(--txt) !important; }
        .cl-seg { background: var(--row); }
        .cl-seg button.on.add, .cl-seg button.on.sub { background: var(--acc) !important; color: var(--acc-txt) !important; box-shadow: none; }
        .cl-seg button { color: var(--mut); }
        .cl-chips button { background: var(--row2) !important; color: var(--txt) !important; box-shadow: none; }
        .cl-chips button:hover { background: var(--line) !important; }
        .cl-lbl { color: var(--mut); }
        .cl-preview { background: var(--row); }
        .cl-preview em.add, .cl-preview em.sub { background: var(--row2); color: var(--txt); }
        /* tables */
        table { border-collapse: separate; border-spacing: 0 6px; padding: 0 12px 8px; }
        thead tr, thead th { background: transparent !important; border: 0 !important; color: var(--mut) !important; font-weight: 600; font-size: 12.5px !important; }
        tbody tr { border: 0 !important; background: transparent !important; }
        tbody td { background: var(--row); padding-top: 14px !important; padding-bottom: 14px !important; transition: background .2s; }
        tbody td:first-child { border-radius: 12px 0 0 12px; padding-left: 18px !important; }
        tbody td:last-child { border-radius: 0 12px 12px 0; padding-right: 18px !important; }
        tbody tr:hover td { background: var(--row2); }
        /* page transitions */
        .cl-page-in { animation: clPage .5s var(--ease) both; }
        .cl-page-in > * > *, .cl-page-in > * { animation: clRise .55s var(--ease) both; }
        .cl-page-in > * > *:nth-child(1) { animation-delay: .03s; } .cl-page-in > * > *:nth-child(2) { animation-delay: .07s; }
        .cl-page-in > * > *:nth-child(3) { animation-delay: .11s; } .cl-page-in > * > *:nth-child(4) { animation-delay: .15s; }
        .cl-page-in > * > *:nth-child(5) { animation-delay: .19s; } .cl-page-in > * > *:nth-child(n+6) { animation-delay: .23s; }
        .cl-toast { animation: clToast .4s var(--ease) both !important; }
        .fixed.inset-0 { animation: clFade .2s ease both; }
        .fixed.inset-0 > div { animation: clPop .3s var(--ease) both; }
        @keyframes clPage { from { opacity: 0; } to { opacity: 1; } }
        @keyframes clRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        @keyframes clLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        @keyframes clFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes clPop { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
        @keyframes clToast { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        ::-webkit-scrollbar-thumb { background: var(--line); }
        @media (max-width: 900px) {

            .cl-title { font-size: 24px; }
            .cl-end .cl-nav[data-tip]:hover::before { display: none; }
        }
        /* ===== Fixes: button contrast, text row actions, loading ===== */
        html button[class*="bg-brand-"].text-white,
        html button[class*="bg-purple-6"].text-white,
        html button[class*="bg-slate-900"].text-white,
        html button[class*="bg-slate-800"].text-white,
        html button[class*="bg-rose-6"].text-white,
        html button[class*="bg-red-6"].text-white,
        html button[class*="bg-emerald-6"].text-white {
            background: var(--acc) !important;
            color: var(--acc-txt) !important;
            border: 0 !important;

        html button[class*="bg-slate-800"].text-white:hover,

        .cl-nav span { display: inline !important; }

        .cl-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 340px; color: var(--mut); font-size: 13px; font-weight: 600; }
        .cl-spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--acc); border-radius: 50%; animation: clSpin .7s linear infinite; }
        @keyframes clLoad { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        @keyframes clSpin { to { transform: rotate(360deg); } }
        .cl-warn { background: var(--row2); color: var(--txt); border-bottom: 1px solid var(--line); text-align: center; font-size: 12.5px; font-weight: 600; padding: 8px 16px; }

        /* ===== Professional polish ===== */
        :root{--acc:#2563eb;--acc-txt:#fff;--ok:#059669;--bad:#e11d48;--warn:#d97706;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -14px rgba(16,24,40,.16)}
        .dark{--acc:#3b82f6;--acc-txt:#fff;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--shadow:none}
        html .rounded-xl.shadow-sm{box-shadow:var(--shadow)!important;border:1px solid var(--line)}
        html .cl-title{font-size:26px}
        html [class*="text-emerald-"]{color:var(--ok)!important}
        html [class*="text-rose-"],html [class*="text-red-"]{color:var(--bad)!important}
        html [class*="text-amber-"]{color:var(--warn)!important}

        html [class*="bg-amber-1"]:not(button),html [class*="bg-amber-9"]:not(button){background:rgba(245,158,11,.15)!important}
        html span[class*="border"][class*="text-["]{border:0!important}
        html tbody td{font-size:13px}

        function buildPayload() {
            return {
                companies: window.AppState.companies,
                vehicles: window.AppState.vehicles,
                manualStats: window.AppState.manualStats,
                statsHistory: window.AppState.statsHistory,
                vehicleHistory: window.AppState.vehicleHistory,
                isSeed: window.AppState.isSeed,
                updatedAt: window.AppState.updatedAt
            };
        }

        async function pushToCloud() {
            const st = window.AppState;
            if (!st.db || !st.cloudReady || st.isSeed) return;
            try {
                const { error } = await supabase.from(SUPABASE_TABLE).upsert({
                    id: SUPABASE_ROW_ID,
                    payload: buildPayload(),
                    updated_at: st.updatedAt
                }, { onConflict: 'id' });
                if (error) throw error;
                st.cloudStatus = 'connected';
                st.cloudConnected = true;
            } catch (err) {
                console.error('Supabase save error:', err);
                st.cloudStatus = 'error';
                renderApp();
            }
        }

        async function listenToCloudData() {
            const st = window.AppState;
            try {
                const { data: row, error } = await supabase
                    .from(SUPABASE_TABLE)
                    .select('id,payload,updated_at')
                    .eq('id', SUPABASE_ROW_ID)
                    .maybeSingle();
                if (error) throw error;

                st.cloudStatus = 'connected';
                st.cloudConnected = true;
                if (!row) {
                    st.cloudReady = true;
                    await pushToCloud();
                    renderApp();
                } else {
                    const cloud = row.payload || {};
                    const cloudTs = row.updated_at || cloud.updatedAt || 0;
                    st.cloudReady = true;
                    if (!st.isSeed && (st.updatedAt || 0) > cloudTs) {
                        await pushToCloud();
                        renderApp();
                    } else {
                        if (!st.isSeed) {
                            try { localStorage.setItem('fleettrack_db_backup_before_cloud', JSON.stringify(buildPayload())); } catch(e) {}
                        }
                        if (!(cloud.isSeed === true && !st.isSeed)) applyCloudData(cloud);
                        renderApp();
                    }
                }

                supabase.channel('clicklife-fleet-data')
                    .on('postgres_changes', {
                        event: '*', schema: 'public', table: SUPABASE_TABLE,
                        filter: `id=eq.${SUPABASE_ROW_ID}`
                    }, (change) => {
                        if (change.eventType === 'DELETE') return;
                        const incoming = change.new?.payload || {};
                        const incomingTs = change.new?.updated_at || incoming.updatedAt || 0;
                        if (incomingTs > (window.AppState.updatedAt || 0)) {
                            applyCloudData(incoming);
                            renderApp();
                        }
                    })
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            st.cloudStatus = 'connected';
                            st.cloudConnected = true;
                            renderApp();
                        }
                    });
            } catch (err) {
                console.warn('Supabase connection error:', err);
                st.cloudStatus = 'error';
                st.cloudConnected = false;
                renderApp();
            }
        }

        // Called after every user change. Demo seed data is never uploaded to the cloud.
        function saveDataLocally(fromSeed) {
            const st = window.AppState;
            st.isSeed = fromSeed === true;
            st.updatedAt = Date.now();
            try {
                localStorage.setItem('fleettrack_db_data', JSON.stringify(buildPayload()));
            } catch (e) {
                console.error('Unable to save local data:', e);
                showNotification('Could not save locally. Check browser storage permissions.', 'warning');
            }
            pushToCloud();
        }

        // Keep local browser data durable if the page is backgrounded or closed.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && window.AppState?.isAuthenticated) {
                try { localStorage.setItem('fleettrack_db_data', JSON.stringify(buildPayload())); } catch (e) {}
            }
        });

        function applyCloudData(c) {
            const st = window.AppState;
            st.companies = c.companies || [];
            st.vehicles = c.vehicles || [];
            st.manualStats = c.manualStats || {};
            st.statsHistory = c.statsHistory || [];
            st.vehicleHistory = c.vehicleHistory || [];
            st.isSeed = false;
            st.updatedAt = c.updatedAt || 0;
            normalizeData();
            localStorage.setItem('fleettrack_db_data', JSON.stringify(buildPayload()));
        }

        window.uploadDeviceDataToCloud = async function() {
            const st = window.AppState;
            if (st.cloudStatus !== 'connected') { alert("Supabase is not connected. Check the table and RLS setup."); return; }
            if (!confirm("Replace the shared Supabase data with the data on THIS device? Other PCs will receive it.")) return;
            st.cloudReady = true;
            st.isSeed = false;
            st.updatedAt = Date.now();
            localStorage.setItem('fleettrack_db_data', JSON.stringify(buildPayload()));
            await pushToCloud();
            if (st.cloudStatus === 'connected') showNotification('This device data was uploaded to Supabase.', 'success');
        };

        window.restoreLocalBackup = function() {
            const raw = localStorage.getItem('fleettrack_db_backup_before_cloud');
            if (!raw) { alert("No safety copy found on this device."); return; }
            if (!confirm("Load the data this device had before it synced with the cloud? Use 'Upload this device data to Supabase' afterwards to share it.")) return;
            const c = JSON.parse(raw);
            applyCloudData(c);
            window.AppState.updatedAt = Date.now();
            localStorage.setItem('fleettrack_db_data', JSON.stringify(buildPayload()));
            renderApp();
            showNotification('Safety copy restored on this device.', 'info');
        };

        function normalizeData() {
            // Preserve the archived flag when data is loaded from localStorage or cloud.
            // The old implementation reset every vehicle to active on each load.
            (window.AppState.vehicles || []).forEach(v => { v.archived = Boolean(v.archived); v.wrongInstall = Boolean(v.wrongInstall); });
            const MAP = { NotRenewed: 'Not Renewed', NotActivated: 'Not Activated' };
            Object.values(window.AppState.manualStats || {}).forEach(st => {
                Object.keys(MAP).forEach(k => { if (k in st) { if (st[MAP[k]] === undefined) st[MAP[k]] = st[k]; delete st[k]; } });
                // Independent total: seed once from the old sum so the number does not jump, then it is edited on its own.
                if (st.Total === undefined) st.Total = STAT_KEYS.reduce((a, k) => a + (st[k] || 0), 0) + (st['Non Active'] || 0);
                delete st['Non Active']; delete st['NonActive'];
            });
            (window.AppState.vehicles || []).forEach(v => { if (v.status === 'Non Active') v.status = 'Deactivated'; });
        }
        window.normalizeData = normalizeData;

        // Initialize Data
        initializeDefaultData();
        normalizeData();

        // Check Login Session
        const session = sessionStorage.getItem('fleettrack_session');
        if (session === 'active') {
            window.AppState.isAuthenticated = true;
            window.AppState.currentUser = 'admin';
        }

        if (window.AppState.theme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Expose helper functions to global window object
        window.saveDataLocally = saveDataLocally;
        window.renderApp = renderApp;

        
        // Status Colors Definition
        const STATUS_CONFIG = {

            'Not Activated': { bg: 'bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300 border-blue-300 dark:border-blue-800', badge: 'bg-blue-500' },

        const CL_AV_COLS = [['#3b82f6','#1e3a8a'],['#10b981','#065f46'],['#8b5cf6','#4c1d95'],['#f59e0b','#92400e'],['#ec4899','#831843'],['#06b6d4','#155e75']];
        function compAvatar(name, n=48) {
            const t = (name || '?').trim(), w = t.split(/\s+/).filter(Boolean);
            const ini = ((w[0] || '?')[0] + (w.length > 1 ? w[1][0] : '')).toUpperCase();
            const h = [...t].reduce((a, c) => a + c.charCodeAt(0), 0), c = CL_AV_COLS[h % CL_AV_COLS.length];
            return `<div style="width:${n}px;height:${n}px;border-radius:${Math.round(n*.3)}px;background:linear-gradient(135deg,${c[0]},${c[1]});color:#fff;display:grid;place-items:center;font-weight:800;font-size:${Math.round(n*.36)}px;letter-spacing:.02em;box-shadow:0 6px 16px -6px ${c[0]}99;flex:none">${ini}</div>`;
        }
        const CL_SPARK_COL = {'Signal':'#34d399','Deactivated':'#94a3b8','Failing':'#fbbf24','Dead':'#f87171','Not Renewed':'#c084fc','Not Activated':'#60a5fa','Expired':'#fb7185','Removed':'#f472b6'};
        function clSpark(key, val) {
            let seed = [...key].reduce((a,c)=>a+c.charCodeAt(0),0) + val, y = 20, pts = [];
            for (let i=0;i<24;i++){ seed=(seed*9301+49297)%233280; y+=(seed/233280-.5)*7; y=Math.max(5,Math.min(30,y)); pts.push([i*200/23,y]); }
            const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
            const c = CL_SPARK_COL[key] || '#60a5fa', id = 'sp'+key.replace(/\W/g,'');
            return `<svg viewBox="0 0 200 34" preserveAspectRatio="none" class="cl-spark"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".3"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${d} L200 34 L0 34 Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;

            window.AppState.modal.amount = Math.abs(changeDelta) || 1;

            const set = (id, fn) => { const el = document.getElementById(id); if (el) fn(el); };
            set('statNewVal', el => el.textContent = m.newVal);
            set('statChangeVal', el => { el.textContent = (m.changeDelta > 0 ? '+' : '') + m.changeDelta; el.className = m.dir > 0 ? 'add' : 'sub'; });

        window.handleAddVehicle = function(e, forceAdd = false) {
            if (e) e.preventDefault();
            const companyId = document.getElementById('vehCompId').value;
            const plateNumber = document.getElementById('vehPlate').value.trim();
            const vin = document.getElementById('vehVin').value.trim();
            const deviceNumber = document.getElementById('vehDevice').value.trim();
            const simCardNumber = document.getElementById('vehSim').value.trim();
            const status = document.getElementById('vehStatus').value;
            const installed = document.getElementById('vehInstalled').value;
            const installationStatus = document.getElementById('vehInstStatus').value;
            const notes = document.getElementById('vehNotes').value.trim();

            if (!companyId || !plateNumber || !vin) {
                alert("Company, Plate Number, and VIN are required.");
                return;
            }

            // Check Duplicate Warning
            if (!forceAdd) {
                const existing = window.AppState.vehicles.find(v => 
                    v.plateNumber.toLowerCase() === plateNumber.toLowerCase() || 
                    v.vin.toLowerCase() === vin.toLowerCase()
                );
                if (existing) {
                    window.AppState.modal = {
                        type: 'DUPLICATE_WARNING',
                        existing,
                        newData: { companyId, plateNumber, vin, deviceNumber, simCardNumber, status, installed, installationStatus, notes }
                    };
                    renderApp();
                    return;
                }
            }

            const newVeh = {
                id: 'v_' + Date.now(),
                companyId,
                plateNumber,
                vin,
                deviceNumber,
                simCardNumber,
                correctDeviceNumber: deviceNumber,
                correctSimCardNumber: simCardNumber,
                status,
                installed,
                installationStatus,
                notes,
                archived: false,
                createdAt: new Date().toISOString()
            };

            window.AppState.vehicles.unshift(newVeh);
            saveDataLocally();

            window.AppState.modal = null;
            showNotification(`Vehicle ${plateNumber} added successfully.`, 'success');
        };

        window.handleEditVehicle = function(e) {
            e.preventDefault();
            const modal = window.AppState.modal;
            const v = modal.vehicle;

            const newCompId = document.getElementById('editVehCompId').value;
            const newPlate = document.getElementById('editVehPlate').value.trim();
            const newVin = document.getElementById('editVehVin').value.trim();
            const newDevice = document.getElementById('editVehDevice').value.trim();
            const newSim = document.getElementById('editVehSim').value.trim();
            const newCorrectDevice = document.getElementById('editVehCorrectDevice').value.trim();
            const newCorrectSim = document.getElementById('editVehCorrectSim').value.trim();
            const newStatus = document.getElementById('editVehStatus').value;
            const newInstalled = document.getElementById('editVehInstalled').value;
            const newInstStatus = document.getElementById('editVehInstStatus').value;
            const newNotes = document.getElementById('editVehNotes').value.trim();
            const reason = document.getElementById('editVehReason').value.trim();

            const target = window.AppState.vehicles.find(item => item.id === v.id);
            if (!target) return;

            // Audit changes
            const now = new Date();
            const changes = [];

            if (target.deviceNumber !== newDevice) changes.push({ field: 'Device Number', old: target.deviceNumber, new: newDevice });
            if (target.simCardNumber !== newSim) changes.push({ field: 'SIM Card Number', old: target.simCardNumber, new: newSim });
            if (target.plateNumber !== newPlate) changes.push({ field: 'Plate Number', old: target.plateNumber, new: newPlate });
            if (target.vin !== newVin) changes.push({ field: 'VIN / Chassis', old: target.vin, new: newVin });
            if (target.status !== newStatus) changes.push({ field: 'Status', old: target.status, new: newStatus });
            if (target.installed !== newInstalled) changes.push({ field: 'Installed', old: target.installed, new: newInstalled });
            if (target.installationStatus !== newInstStatus) changes.push({ field: 'Installation Status', old: target.installationStatus, new: newInstStatus });

            if (changes.length > 0 && !reason) {
                alert("Please provide a reason for editing key vehicle details.");
                return;
            }

            // Log vehicle histories
            changes.forEach(ch => {
                window.AppState.vehicleHistory.unshift({
                    id: 'vh_' + Date.now() + Math.random().toString().slice(2,5),
                    vehicleId: target.id,
                    plateNumber: newPlate,
                    fieldChanged: ch.field,
                    oldValue: ch.old || 'None',
                    newValue: ch.new || 'None',
                    reason: reason || 'Information update',
                    date: now.toISOString().split('T')[0],
                    time: now.toTimeString().split(' ')[0],
                    user: window.AppState.currentUser || 'admin'
                });
            });

            // Update Vehicle
            target.companyId = newCompId;
            target.plateNumber = newPlate;
            target.vin = newVin;
            target.deviceNumber = newDevice;
            target.simCardNumber = newSim;
            target.correctDeviceNumber = newCorrectDevice;
            target.correctSimCardNumber = newCorrectSim;
            target.status = newStatus;
            target.installed = newInstalled;
            target.installationStatus = newInstStatus;
            target.notes = newNotes;

            saveDataLocally();
            window.AppState.modal = null;
            showNotification(`Vehicle ${newPlate} updated successfully.`, 'success');
        };

        window.triggerExcelExport = function() {
            const compId = document.getElementById('excelCompany').value;
            const datasetKey = document.getElementById('excelDataset').value;

            let list = window.AppState.vehicles.slice();
            if (compId !== 'ALL') list = list.filter(v => v.companyId === compId);
            if (datasetKey === 'deadCars') list = list.filter(v => v.status === 'Dead');
            if (datasetKey === 'onlineCars') list = list.filter(v => v.status === 'Signal');
            if (datasetKey === 'wrongCars') list = list.filter(v => v.wrongInstall);

            let dataToExport;
            if (datasetKey === 'carNumbers') {
                dataToExport = list.map(v => ({
                    'Company': getCompanyName(v.companyId),
                    'Plate Number': v.plateNumber
                }));
            } else {
                dataToExport = list.map(v => ({
                    'Company': getCompanyName(v.companyId),
                    'Plate Number': v.plateNumber,
                    'VIN / Chassis': v.vin,
                    'Device Number': v.deviceNumber,
                    'SIM Card Number': v.simCardNumber,
                    'Status': v.status,
                    'Installed': v.installed,
                    'Installation Status': v.installationStatus,
                    'Installation Check': v.wrongInstall ? 'Wrong installation' : 'Correct',
                    'Notes': v.notes || ''
                }));
            }

            if (dataToExport.length === 0) {
                alert("No records available to export for selected options.");
                return;
            }

            const fileName = `ClicklifeSecurePath_${datasetKey}_${Date.now()}.xlsx`;
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "FleetReport");
            XLSX.writeFile(workbook, fileName);
            showNotification(`Excel exported: ${fileName}`, 'success');
        };

        // ===== PDF report engine =====
        const PDF_COL = {'Signal':[16,185,129],'Deactivated':[100,116,139],'Failing':[245,158,11],'Dead':[239,68,68],'Not Renewed':[168,85,247],'Not Activated':[59,130,246],'Expired':[220,38,38],'Removed':[219,39,119]};
        const PDF_NAVY = [15,23,42], PDF_BLUE = [37,99,235], PDF_INK = [30,41,59], PDF_MUTED = [100,116,139], PDF_LINE = [226,232,240], PDF_SOFT = [248,250,252];
        let _pdfLogoCache = null;

        function pdfLogoPng() {
            if (_pdfLogoCache) return _pdfLogoCache;
            _pdfLogoCache = new Promise(res => {
                try {
                    const img = new Image();
                    const done = setTimeout(() => res(null), 2500);
                    img.onload = () => {
                        clearTimeout(done);
                        const c = document.createElement('canvas'); c.width = c.height = 320;
                        c.getContext('2d').drawImage(img, 0, 0, 320, 320);
                        res(c.toDataURL('image/png'));
                    };
                    img.onerror = () => { clearTimeout(done); res(null); };
                    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(CL_LOGO(320));
                } catch (e) { res(null); }
            });
            return _pdfLogoCache;
        }

        function pdfLogo(doc, logo, x, y, s) {
            if (logo) { doc.addImage(logo, 'PNG', x, y, s, s); return; }
            doc.setFillColor(...PDF_BLUE); doc.roundedRect(x, y, s, s, s * 0.28, s * 0.28, 'F');
        }

        function pdfSection(doc, text, y) {
            doc.setFillColor(...PDF_BLUE); doc.roundedRect(14, y - 4.2, 1.6, 5.6, 0.8, 0.8, 'F');
            doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...PDF_NAVY);
            doc.text(text, 18.5, y);
        }

        async function buildReportPDF(opts) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });
            const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
            const compId = window.AppState.selectedCompanyId;
            const compName = getCompanyName(compId);
            const stats = getCompanyStats(compId);
            const total = stats.Total || 0;
            const logo = await pdfLogoPng();
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + '  ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            const cars = carsOf(compId);

            // ---- cover header ----
            doc.setFillColor(...PDF_NAVY); doc.rect(0, 0, W, 44, 'F');
            doc.setFillColor(...PDF_BLUE); doc.rect(0, 44, W, 1.6, 'F');
            pdfLogo(doc, logo, 14, 10, 22);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.setTextColor(255, 255, 255);
            doc.text('Clicklife SecurePath', 41, 21);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
            doc.text('Vehicle Tracking Management System', 41, 27.5);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(255, 255, 255);
            doc.text(opts.title, W - 14, 19, { align: 'right' });
            doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(148, 163, 184);
            doc.text('Generated ' + dateStr, W - 14, 25.5, { align: 'right' });

            // ---- scope ----
            doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...PDF_MUTED);
            doc.text('COMPANY SCOPE', 14, 55);
            doc.setFontSize(14); doc.setTextColor(...PDF_NAVY);
            doc.text(compName, 14, 62);

            let y = 72;

            if (opts.stats) {
                // ---- KPI cards ----
                const gap = 4, cw = (W - 28 - gap * 3) / 4, ch = 24;
                const wrong = installSplit(cars).w;
                const pct = v => total > 0 ? Math.round(v / total * 100) + '% of total' : '-';
                const kpis = [
                    ['Total vehicles', total, 'Tracked fleet size', PDF_BLUE],
                    ['Online (Signal)', stats.Signal || 0, pct(stats.Signal || 0), PDF_COL['Signal']],
                    ['Dead', stats.Dead || 0, pct(stats.Dead || 0), PDF_COL['Dead']],
                    ['Wrong installations', wrong, 'Flagged for review', [234, 88, 12]]
                ];
                kpis.forEach((k, i) => {
                    const x = 14 + i * (cw + gap);
                    doc.setFillColor(...PDF_SOFT); doc.setDrawColor(...PDF_LINE); doc.setLineWidth(0.3);
                    doc.roundedRect(x, y, cw, ch, 2.5, 2.5, 'FD');
                    doc.setFillColor(...k[3]); doc.roundedRect(x, y + 4, 1.6, ch - 8, 0.8, 0.8, 'F');
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_MUTED);
                    doc.text(k[0].toUpperCase(), x + 6, y + 7.5);
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.setTextColor(...PDF_NAVY);
                    doc.text(String(k[1]), x + 6, y + 16.2);
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(...PDF_MUTED);
                    doc.text(k[2], x + 6, y + 21);
                });
                y += ch + 12;

                // ---- status breakdown ----
                pdfSection(doc, 'Status Breakdown', y);
                const rows = STAT_KEYS.map(k => {
                    const n = stats[k] || 0, s = installSplit(cars.filter(v => v.status === k));
                    return [k, n, total > 0 ? (n / total * 100).toFixed(1) + '%' : '-', '', s.w, s.c];
                });
                doc.autoTable({
                    startY: y + 4,
                    head: [['Status', 'Count', '% of total', 'Distribution', 'Wrong install', 'Correct install']],
                    body: rows,
                    theme: 'plain',
                    margin: { left: 14, right: 14, top: 26, bottom: 18 },
                    styles: { font: 'helvetica', fontSize: 9, cellPadding: { top: 3.4, bottom: 3.4, left: 3, right: 3 }, textColor: PDF_INK, lineColor: PDF_LINE, lineWidth: { bottom: 0.2 } },
                    headStyles: { fillColor: PDF_NAVY, textColor: 255, fontStyle: 'bold', fontSize: 8, lineWidth: 0 },
                    alternateRowStyles: { fillColor: PDF_SOFT },
                    columnStyles: {
                        0: { cellWidth: 38, fontStyle: 'bold', cellPadding: { top: 3.4, bottom: 3.4, left: 9, right: 2 } },
                        1: { cellWidth: 20, halign: 'right', fontStyle: 'bold' },
                        2: { cellWidth: 24, halign: 'right' },
                        3: { cellWidth: 'auto' },
                        4: { cellWidth: 26, halign: 'center' },
                        5: { cellWidth: 26, halign: 'center' }
                    },
                    didParseCell: d => {
                        if (d.section !== 'body') return;
                        if (d.column.index === 4 && Number(d.cell.raw) > 0) { d.cell.styles.textColor = [220, 38, 38]; d.cell.styles.fontStyle = 'bold'; }
                        if (d.column.index === 5 && Number(d.cell.raw) > 0) { d.cell.styles.textColor = [5, 150, 105]; d.cell.styles.fontStyle = 'bold'; }
                        if (d.column.index === 0) d.cell.styles.textColor = PDF_COL[d.cell.raw] || PDF_INK;
                    },
                    didDrawCell: d => {
                        if (d.section !== 'body') return;
                        const c = d.cell, key = STAT_KEYS[d.row.index], col = PDF_COL[key] || PDF_BLUE;
                        if (d.column.index === 0) {
                            doc.setFillColor(...col); doc.circle(c.x + 4.2, c.y + c.height / 2, 1.4, 'F');
                        }
                        if (d.column.index === 3) {
                            const bx = c.x + 3, bw = c.width - 6, by = c.y + c.height / 2 - 1.5;
                            doc.setFillColor(226, 232, 240); doc.roundedRect(bx, by, bw, 3, 1.5, 1.5, 'F');
                            const share = total > 0 ? Math.min(1, (stats[key] || 0) / total) : 0;
                            if (share > 0) { doc.setFillColor(...col); doc.roundedRect(bx, by, Math.max(bw * share, 2), 3, 1.5, 1.5, 'F'); }
                        }
                        // autoTable caches its own fill colour: restore it so row shading does not pick up our dot/bar colour
                        doc.setFillColor(...PDF_SOFT);
                    }
                });
                y = doc.lastAutoTable.finalY + 6;
                doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5); doc.setTextColor(...PDF_MUTED);
                const note = doc.splitTextToSize('Note: category counts may overlap (a vehicle can be Dead and Expired at the same time), so the total is tracked independently and is not the sum of the categories. Wrong / correct install figures come from reviewed vehicle records.', W - 28);
                doc.text(note, 14, y);
                y += note.length * 3.6 + 8;
            }

            if (opts.vehicles) {
                const list = cars;
                if (y > H - 60) { doc.addPage(); y = 30; }
                pdfSection(doc, 'Active Vehicles (' + list.length + ')', y);
                if (!list.length) {
                    doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(...PDF_MUTED);
                    doc.text('No active vehicles recorded for this scope.', 14, y + 9);
                } else {
                    const showComp = compId === 'ALL';
                    const head = [showComp ? ['Company', 'Plate #', 'VIN / Chassis', 'Device #', 'SIM #', 'Status', 'Installed', 'Check'] : ['Plate #', 'VIN / Chassis', 'Device #', 'SIM #', 'Status', 'Installed', 'Check']];
                    const body = list.map(v => {
                        const r = [v.plateNumber, v.vin || '-', v.deviceNumber || '-', v.simCardNumber || '-', v.status, v.installed || '-', v.wrongInstall ? 'Wrong' : 'Correct'];
                        return showComp ? [getCompanyName(v.companyId)].concat(r) : r;
                    });
                    const sIdx = showComp ? 5 : 4, cIdx = showComp ? 7 : 6;
                    doc.autoTable({
                        startY: y + 4,
                        head, body,
                        theme: 'plain',
                        margin: { left: 14, right: 14, top: 26, bottom: 18 },
                        styles: { font: 'helvetica', fontSize: 7.6, cellPadding: 2.4, textColor: PDF_INK, lineColor: PDF_LINE, lineWidth: { bottom: 0.2 }, overflow: 'linebreak' },
                        headStyles: { fillColor: PDF_NAVY, textColor: 255, fontStyle: 'bold', fontSize: 7.6, lineWidth: 0 },
                        alternateRowStyles: { fillColor: PDF_SOFT },
                        didParseCell: d => {
                            if (d.section !== 'body') return;
                            if (d.column.index === sIdx) { d.cell.styles.textColor = PDF_COL[d.cell.raw] || PDF_INK; d.cell.styles.fontStyle = 'bold'; }
                            if (d.column.index === cIdx) { d.cell.styles.fontStyle = 'bold'; d.cell.styles.textColor = d.cell.raw === 'Wrong' ? [220, 38, 38] : [5, 150, 105]; }
                        }
                    });
                }
            }

            // ---- running header + footer on every page ----
            const pages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pages; i++) {
                doc.setPage(i);
                if (i > 1) {
                    doc.setFillColor(...PDF_NAVY); doc.rect(0, 0, W, 16, 'F');
                    doc.setFillColor(...PDF_BLUE); doc.rect(0, 16, W, 0.9, 'F');
                    pdfLogo(doc, logo, 14, 3.5, 9);
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(255, 255, 255);
                    doc.text('Clicklife SecurePath', 26, 9.6);
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(148, 163, 184);
                    doc.text(opts.title + '  |  ' + compName, W - 14, 9.6, { align: 'right' });
                }
                doc.setDrawColor(...PDF_LINE); doc.setLineWidth(0.3); doc.line(14, H - 13, W - 14, H - 13);
                doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_MUTED);
                doc.text('Clicklife SecurePath  |  Confidential fleet report', 14, H - 8);
                doc.text('Page ' + i + ' of ' + pages, W - 14, H - 8, { align: 'right' });
            }

            const slug = compName.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '');
            doc.save(`Clicklife_${opts.file}_${slug}_${now.toISOString().slice(0, 10)}.pdf`);
        }

        window.downloadBackupJSON = function() {
            const backupObj = {
                version: '1.0',
                backupDate: new Date().toISOString(),
                companies: window.AppState.companies,
                vehicles: window.AppState.vehicles,
                manualStats: window.AppState.manualStats,
                statsHistory: window.AppState.statsHistory,
                vehicleHistory: window.AppState.vehicleHistory
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `ClicklifeSecurePath_Backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();

            showNotification("Backup file generated and downloaded.", 'success');
        };

        window.handleRestorePreview = function() {
            const fileInput = document.getElementById('restoreFileInput');
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                alert("Please select a JSON backup file first.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    window.AppState.modal = {
                        type: 'RESTORE_PREVIEW',
                        backupData: parsed
                    };
                    renderApp();
                } catch(err) {
                    alert("Invalid backup JSON file format.");
                }
            };
            reader.readAsText(file);
        };

        window.executeRestore = function() {
            const modal = window.AppState.modal;
            if (!modal || !modal.backupData) return;

            const data = modal.backupData;
            window.AppState.companies = data.companies || [];
            window.AppState.vehicles = data.vehicles || [];
            window.AppState.manualStats = data.manualStats || {};
            window.AppState.statsHistory = data.statsHistory || [];
            window.AppState.vehicleHistory = data.vehicleHistory || [];

            saveDataLocally();
            window.AppState.modal = null;
            showNotification("System restored successfully from backup.", 'success');
        };

                            <button onclick="executeDeleteCompany('${modal.companyId}')" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold rounded-lg shadow">Permanently Delete</button>
                        </div>
                    </div>
                </div>
                `;
            }

            if (modal.type === 'ADD_COMPANY') {
                return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl max-w-md w-full p-6 text-slate-800 dark:text-slate-100">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold">Add New Company</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
                        </div>

                        <form onsubmit="handleAddCompany(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Company Name *</label>
                                <input type="text" id="compName" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Registration ID</label>
                                <input type="text" id="compRegId" placeholder="e.g. CR-10293" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contact Phone/Email</label>
                                <input type="text" id="compContact" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Notes</label>
                                <textarea id="compNotes" rows="2" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg"></textarea>
                            </div>

                            <div class="flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-semibold rounded-lg">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg">Create Company</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            }

            if (modal.type === 'ADD_VEHICLE') {
                return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl max-w-2xl w-full p-6 text-slate-800 dark:text-slate-100 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold">Add Vehicle (Manual Entry)</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
                        </div>

                        <form onsubmit="handleAddVehicle(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Company *</label>
                                <select id="vehCompId" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    ${window.AppState.companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Plate Number *</label>
                                <input type="text" id="vehPlate" placeholder="e.g. Y-23717" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">VIN / Chassis Number *</label>
                                <input type="text" id="vehVin" placeholder="e.g. SALEA7BX2P2223413" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Device Number</label>
                                <input type="text" id="vehDevice" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">SIM Card Number</label>
                                <input type="text" id="vehSim" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Vehicle Status</label>
                                <select id="vehStatus" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    ${STAT_KEYS.map(s => `<option value="${s}">${s}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Installed</label>
                                <select id="vehInstalled" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Installation Status</label>
                                <select id="vehInstStatus" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    <option value="Installed">Installed</option>
                                    <option value="Not Installed">Not Installed</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Notes</label>
                                <textarea id="vehNotes" rows="2" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg"></textarea>
                            </div>

                            <div class="md:col-span-2 flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-semibold rounded-lg">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg">Save Vehicle</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            }

            if (modal.type === 'DUPLICATE_WARNING') {
                return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl max-w-md w-full p-6 text-slate-800 dark:text-slate-100">
                        <div class="text-amber-500 text-3xl mb-2 text-center">
                                                    </div>
                        <h3 class="text-lg font-bold text-center mb-2">Vehicle May Already Exist!</h3>
                        <div class="bg-amber-50 dark:bg-amber-950/50 p-3 rounded-lg border border-amber-300 dark:border-amber-800 text-xs space-y-1 mb-6 font-mono">
                            <div>Matched Plate: ${modal.existing.plateNumber}</div>
                            <div>Matched VIN: ${modal.existing.vin}</div>
                        </div>

                        <div class="flex items-center justify-center space-x-3">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-semibold rounded-lg">Cancel</button>
                            <button onclick="handleAddVehicle(null, true)" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg">Add Anyway</button>
                        </div>
                    </div>
                </div>
                `;
            }

            if (modal.type === 'EDIT_VEHICLE') {
                const v = modal.vehicle;
                return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl max-w-2xl w-full p-6 text-slate-800 dark:text-slate-100 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold">Edit Vehicle (${v.plateNumber})</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
                        </div>

                        <form onsubmit="handleEditVehicle(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Company</label>
                                <select id="editVehCompId" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    ${window.AppState.companies.map(c => `<option value="${c.id}" ${c.id === v.companyId ? 'selected' : ''}>${c.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Plate Number</label>
                                <input type="text" id="editVehPlate" value="${v.plateNumber}" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">VIN / Chassis</label>
                                <input type="text" id="editVehVin" value="${v.vin}" required class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>

                            <!-- Hardware Tracking Correct vs Wrong -->
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Current Device #</label>
                                <input type="text" id="editVehDevice" value="${v.deviceNumber || ''}" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Correct Device # (Hardware Audit)</label>
                                <input type="text" id="editVehCorrectDevice" value="${v.correctDeviceNumber || v.deviceNumber || ''}" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Current SIM #</label>
                                <input type="text" id="editVehSim" value="${v.simCardNumber || ''}" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Correct SIM # (Hardware Audit)</label>
                                <input type="text" id="editVehCorrectSim" value="${v.correctSimCardNumber || v.simCardNumber || ''}" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status</label>
                                <select id="editVehStatus" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    ${STAT_KEYS.map(s => `<option value="${s}" ${s === v.status ? 'selected' : ''}>${s}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Installed</label>
                                <select id="editVehInstalled" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    <option value="Yes" ${v.installed === 'Yes' ? 'selected' : ''}>Yes</option>
                                    <option value="No" ${v.installed === 'No' ? 'selected' : ''}>No</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Installation Status</label>
                                <select id="editVehInstStatus" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                                    <option value="Installed" ${v.installationStatus === 'Installed' ? 'selected' : ''}>Installed</option>
                                    <option value="Not Installed" ${v.installationStatus === 'Not Installed' ? 'selected' : ''}>Not Installed</option>
                                </select>
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Notes</label>
                                <textarea id="editVehNotes" rows="2" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">${v.notes || ''}</textarea>
                            </div>

                            <div class="md:col-span-2 border-t border-slate-200 dark:border-slate-700 pt-3">
                                <label class="block text-xs font-semibold uppercase text-rose-500 mb-1">Reason for field changes *</label>
                                <input type="text" id="editVehReason" placeholder="e.g. Device replaced / SIM swapped" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg">
                            </div>

                            <div class="md:col-span-2 flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-semibold rounded-lg">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            }

            if (modal.type === 'VIEW_VEHICLE_DETAIL') {
                const v = modal.vehicle;
                const histories = modal.histories;
                return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl max-w-2xl w-full p-6 text-slate-800 dark:text-slate-100 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200 dark:border-slate-700">
                            <div>
                                <span class="text-xs font-bold text-brand-600 uppercase">Vehicle Details & Audit History</span>
                                <h3 class="text-xl font-bold">${v.plateNumber}</h3>
                            </div>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
                        </div>

                        <div class="grid grid-cols-2 gap-4 text-xs mb-6 bg-slate-50 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                            <div><strong>Company:</strong> ${getCompanyName(v.companyId)}</div>
                            <div><strong>VIN / Chassis:</strong> <span class="font-mono">${v.vin}</span></div>
                            <div><strong>Device Number:</strong> <span class="font-mono">${v.deviceNumber || 'N/A'}</span></div>
                            <div><strong>Correct Device:</strong> <span class="font-mono">${v.correctDeviceNumber || 'N/A'}</span></div>
                            <div><strong>SIM Card Number:</strong> <span class="font-mono">${v.simCardNumber || 'N/A'}</span></div>
                            <div><strong>Correct SIM:</strong> <span class="font-mono">${v.correctSimCardNumber || 'N/A'}</span></div>
                            <div><strong>Status:</strong> ${v.status}</div>
                            <div><strong>Installation:</strong> ${v.installed} (${v.installationStatus})</div>
                        </div>

                        <h4 class="font-bold text-xs uppercase tracking-wider text-slate-500 mb-2">Vehicle Modification Audit Trail</h4>
                        <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                            ${histories.length === 0 ? `
                                <div class="text-xs text-slate-400 italic">No past modification history logged for this vehicle.</div>
                            ` : histories.map(h => `
                                <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs">
                                    <div class="flex justify-between font-semibold text-slate-700 dark:text-slate-300">
                                        <span>${h.fieldChanged}: ${h.oldValue} to ${h.newValue}</span>
                                        <span class="text-[11px] text-slate-400 font-mono">${h.date} ${h.time}</span>
                                    </div>
                                    <div class="text-slate-500 text-[11px] mt-1">Reason: ${h.reason}</div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-6 flex justify-end">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-white text-xs font-semibold rounded-lg">Close</button>
                        </div>
                    </div>
                </div>
                `;
            }

            if (modal.type === 'RESTORE_PREVIEW') {
                const b = modal.backupData;
                return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl max-w-md w-full p-6 text-slate-800 dark:text-slate-100">
                        <h3 class="text-lg font-bold mb-3">Backup Preview</h3>

                        <div class="bg-slate-100 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-xs space-y-2 mb-6">
                            <div class="flex justify-between"><span>Backup Date:</span> <strong>${b.backupDate || 'Unknown'}</strong></div>
                            <div class="flex justify-between"><span>Companies:</span> <strong>${(b.companies || []).length}</strong></div>
                            <div class="flex justify-between"><span>Vehicles:</span> <strong>${(b.vehicles || []).length}</strong></div>
                        </div>

                        <div class="flex justify-end space-x-2">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-semibold rounded-lg">Cancel</button>
                            <button onclick="executeRestore()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-lg">Confirm Restore</button>
                        </div>
                    </div>
                </div>
                `;
            }

            return '';
        }

        window.closeModal = function() {
            window.AppState.modal = null;
            renderApp();
        };


        function renderApp() {
            const container = document.getElementById('app');
            if (!container) return;

            if (!window.AppState.isAuthenticated) {
                container.innerHTML = renderLogin();
                return;
            }

            let mainContent = '';
            if (window.AppState.loading) {
                mainContent = '<div class="cl-loading"><div class="cl-spinner"></div><span>Loading</span></div>';
            } else switch (window.AppState.activeTab) {
                case 'dashboard':
                    mainContent = renderDashboardView();
                    break;
                case 'companies':
                    mainContent = renderCompaniesView();
                    break;
                case 'cars':
                    mainContent = renderCarsView(false);
                    break;
                case 'installation':
                    mainContent = renderInstallationView();
                    break;
                case 'reports':
                    mainContent = renderReportsView();
                    break;
                case 'backup':
                    mainContent = renderBackupView();
                    break;
                case 'settings':
                    mainContent = renderSettingsView();
                    break;
                default:
                    mainContent = renderDashboardView();
            }

            // Toast notification bar
            let notifHTML = '';
            if (window.AppState.notification) {
                const n = window.AppState.notification;
                notifHTML = `
                <div class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center space-x-3 cl-toast text-xs font-semibold">
                                        <span>${n.msg}</span>
                </div>
                `;
            }

            const _anim = window.AppState._pageAnim; window.AppState._pageAnim = false;
            container.innerHTML = `
                ${window.AppState.loading ? '<div class="cl-loader-bar"></div>' : ''}
                ${renderNavbar()}
                ${window.AppState.cloudStatus !== 'connected' ? `<div class="cl-warn">${window.AppState.cloudStatus === 'connecting' ? 'Connecting to Supabase...' : 'Supabase sync is not connected. Changes made on this PC will not appear on other PCs. Open Settings for details.'}</div>` : ''}
                <main class="cl-main">
                    ${renderTopbar()}
                    <div class="cl-page ${_anim ? 'cl-page-in' : ''}">${mainContent}</div>
                </main>
                ${renderModal()}
                ${notifHTML}
            `;
        }

        // Window Load Bootstrapper
        window.onload = function() {
            document.documentElement.classList.toggle('dark', window.AppState.theme === 'dark');
            renderApp();
        };
    </script>
</body>
</html>
